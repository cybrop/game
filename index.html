<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voxel Beacon - Block Defense</title>
  <link rel="stylesheet" href="style.css">
  <!-- CrazyGames SDK v2 / v3 -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v2.js"></script>
</head>
<body>
  <div id="game-wrapper">
    <!-- Top HUD Bar Mount -->
    <header id="top-hud"></header>

    <div id="main-stage">
      <!-- Main Arena Canvas Mount -->
      <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="click-hint">Tip: Click anywhere to summon a TNT orbital strike</div>
        <div id="perf-overlay" class="perf-stats hidden"></div>
      </div>

      <!-- In-Run Upgrade Sidebar Mount -->
      <aside id="upgrade-sidebar"></aside>
    </div>

    <!-- Modals Mount -->
    <div id="game-over-modal" class="overlay hidden"></div>
    <div id="workshop-modal" class="overlay hidden"></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
