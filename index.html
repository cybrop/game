<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voxel Beacon - Block Defense</title>
  <link rel="stylesheet" href="style.css">
  <!-- CrazyGames SDK v2 / v3 -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v2.js"></script>
</head>
<body>
  <div id="game-wrapper">
    <!-- Top HUD Bar Mount -->
    <header id="top-hud"></header>

    <!-- Boss Health Bar Overlay -->
    <div id="boss-hud-bar" class="boss-bar-container hidden">
      <div class="boss-title" id="boss-name">WITHER BEAST</div>
      <div class="boss-health-frame">
        <div class="boss-health-fill" id="boss-hp-fill"></div>
      </div>
    </div>

    <div id="main-stage">
      <!-- Main Arena Canvas Mount -->
      <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="click-hint">Tip: Click anywhere to drop a TNT block</div>
        <div id="perf-overlay" class="perf-stats hidden"></div>
      </div>

      <!-- In-Run Upgrade Sidebar Mount -->
      <aside id="upgrade-sidebar"></aside>
    </div>

    <!-- Modals Mount -->
    <div id="game-over-modal" class="overlay hidden"></div>
    <div id="workshop-modal" class="overlay hidden"></div>

    <!-- Mobile Orientation Warning Overlay -->
    <div id="orientation-warning" class="orientation-screen">
      <div class="orientation-box">
        <span class="rotate-icon">📱 ➔ 🔄</span>
        <h2>ROTATE YOUR DEVICE</h2>
        <p>Please rotate your phone to landscape mode for the best block defense experience!</p>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
