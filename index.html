<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Space Defender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div class="hud-item">SCORE: <span id="score">0</span></div>
      <div class="hud-item">WAVE: <span id="wave">1</span></div>
      <div class="hud-item">HEALTH: <span id="health">100</span>%</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-over-screen" class="overlay hidden">
      <h1>SYSTEM OVERRIDE</h1>
      <p>Final Score: <span id="final-score">0</span></p>
      <button id="restart-btn">REBOOT SYSTEM</button>
    </div>

    <div id="start-screen" class="overlay">
      <h1>CYBER DEFENDER</h1>
      <p>Arrow Keys / WASD to Move &bull; Space or Left-Click to Shoot</p>
      <button id="start-btn">ENGAGE</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
