<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Drill</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud-topbar">
        <div class="brand">CYBER DRILL</div>
        <div class="stats">
          <div class="stat"><span>Ore</span><strong id="ore-value">0</strong></div>
          <div class="stat"><span>Depth</span><strong id="depth-value">0m</strong></div>
          <div class="stat"><span>HP</span><strong id="hp-value">100</strong></div>
          <div class="stat"><span>Shield</span><strong id="shield-value">0</strong></div>
        </div>
      </header>

      <main class="game-shell">
        <aside class="left-panel panel">
          <h3>DRILL</h3>
          <button class="button primary" id="upgrade-drill">Upgrade Drill</button>
          <button class="button" id="upgrade-shield">Upgrade Shield</button>
          <button class="button" id="upgrade-turret">Upgrade Turret</button>
          <button class="button warning" id="start-wave">Start Wave</button>
        </aside>

        <section class="arena-wrap">
          <div id="arena" class="arena">
            <div class="center-core" id="drill-core"></div>
            <div id="enemy-layer"></div>
            <div id="bullet-layer"></div>
          </div>
        </section>

        <aside class="right-panel panel">
          <div class="panel-block">
            <h3>Meta</h3>
            <p>Idle income: <strong id="idle-income">0/s</strong></p>
            <p>Best depth: <strong id="best-depth">0m</strong></p>
          </div>
          <div class="panel-block">
            <h3>Objectives</h3>
            <ul>
              <li>Defend the drill core</li>
              <li>Mine rare crystals</li>
              <li>Survive escalating waves</li>
            </ul>
          </div>
        </aside>
      </main>
    </div>

    <div id="game-over" class="modal hidden" aria-live="polite">
      <div class="modal-card">
        <h2>Drill Integrity Lost</h2>
        <p>Continue the haul and restart the shaft.</p>
        <button id="restart-game" class="button primary">Restart</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
